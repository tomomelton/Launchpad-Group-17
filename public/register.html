<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Food Bank Finder</title>
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Rubik:wght@600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" type='text/css' href="css/base.css">
        <link rel="stylesheet" type='text/css' href="css/footer.css">
        <link rel="stylesheet" type='text/css' href="css/nav.css">
        <link rel="stylesheet" type='text/css' href="css/about.css">
        <link rel="stylesheet" type='text/css' href="css/mobile.css">
        <link rel="stylesheet" type='text/css' href="css/register.css">
    </head>

    <body>
        <header>
            <nav>
            <a href="index.html" class="nav-logo">FoodBank<span>Finder</span></a>

            <button class="nav-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="primary-navigation" data-i18n-aria="open_nav">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>

            <div class="nav-menu" id="primary-navigation">
                <ul class="nav-links">
                <li><a href="about.html" data-i18n="nav_about">About us</a></li>
                <li><a href="foodbanks.html" data-i18n="nav_foodbank">Foodbank</a></li>
                </ul>

                <div class="lang-dropdown">
                <button class="nav-lang" type="button" aria-label="Choose language" data-i18n-aria="choose_language" onclick="document.querySelector('.lang-menu').classList.toggle('open')">
                    <span data-language-label>English</span> <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                </button>
                <div class="lang-menu">
                    <a href="#" onclick="setLanguage('en');return false;">English</a>
                    <a href="#" onclick="setLanguage('fr');return false;">Français</a>
                    <a href="#" onclick="setLanguage('es');return false;">Español</a>
                    <a href="#" onclick="setLanguage('pl');return false;">Polski</a>
                    <a href="#" onclick="setLanguage('ro');return false;">Română</a>
                </div>
                </div>
            </div>
            </nav>
        </header>

        <main>
            <h1 class="sign-heading">Register your Foodbank</h1>

            <form action="#" method="post" id="myForm" class="inputField">

                <fieldset>
                    <div class="input-box">
                        <label for="Name" class="input-label">Name:</label>
                        <input type="text" placeholder="Enter Foodbank Name" id="Name" name="FoodBankName" required>
                    </div>

                    <div class="input-box">
                        <label for="Email" class="input-label">Email:</label>
                        <input type="email" placeholder="Enter Email" id="Email" name="Email" required>
                    </div>

                    <div class="input-box">
                        <label for="Email" class="input-label">Password:</label>
                        <input type="password" placeholder="Enter Password" id="Password" name="Password" required> 
                    </div>

                    <div class="input-box">
                        <label for="Email" class="input-label">Confirm Password:</label>
                        <input type="password" placeholder="Confirm Password" id="Confirm" name="ConfirmPassword" required>
                    </div>

                    <div class="input-box">
                        <label for="Email" class="input-label">Postcode:</label>
                        <input type="text" placeholder="Enter Postcode" id="Postcode" name="Postcode" required>
                    </div>

                    <p class="confirmMessage"> All fields are required.</p>
            
                    <div class="register-btn">
                        <button type="submit" class="btn" value="sendMessage">Register!</button>
                    </div>
                </fieldset>
            </form>
        </main>

        <footer>
            <div class="footer-inner">
                <span class="footer-logo">FoodBankFinder</span>
                <ul class="footer-links">
                <li><a href="#" data-i18n="footer_about">About</a></li>
                <li><a href="#" data-i18n="footer_foodbanks">Foodbanks</a></li>
                <li><a href="register.html" data-i18n="footer_register">Register</a></li>
                <li><a href="#" data-i18n="footer_privacy">Privacy</a></li>
                <li><a href="#" data-i18n="footer_contact">Contact</a></li>
                </ul>
                <span>© 2026 FoodBankFinder</span>
                <div class="footer-accessibility-controls">
                    <button type="button" data-accessibility-toggle="high-contrast" aria-label="Toggle high contrast display" data-i18n-aria="toggle_high_contrast" data-i18n="toggle_high_contrast">Toggle high contrast</button>
                    <button type="button" data-accessibility-toggle="large-text" aria-label="Toggle large text display" data-i18n-aria="toggle_large_text" data-i18n="toggle_large_text">Toggle large text</button>
                </div>
            </div>

            <div class="footer-inner footer-partners">
                <div class="footer-logo-wrap">
                <img src="assets/logo.png" alt="Best Food Bank Finder" class="footer-logo-img">
                </div>
            </div>
            </footer>

        <script src="js/i18n.js"></script>
        <script src="js/accessibility.js"></script>
        <script src="js/nav.js"></script>
        <script src="js/register.js"></script>
        
    </body>
</html>
